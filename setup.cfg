[metadata]
name = hir
version = 0.1.0
description = Early-stage Python CLI for conservative network diagnostics and report export
long_description = file: README.md
long_description_content_type = text/markdown
author = HIR contributors
license = MIT

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    click
    Jinja2
    python-nmap
    scapy

[options.packages.find]
where = src
include = hir, hir.*
exclude =
    tests*
    results*

[options.package_data]
hir.output = templates/*.j2

[options.entry_points]
console_scripts =
    hir = hir.cli:main
