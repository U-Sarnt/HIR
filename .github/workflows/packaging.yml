name: packaging

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build artifacts
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install wheel in clean environment and run smoke checks
        run: |
          rm -rf /tmp/hir-wheel-smoke
          python -m venv /tmp/hir-wheel-smoke
          . /tmp/hir-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          hir --help
          hir ping --help
          hir traceroute --help
          hir arp-scan --help
          hir report-export --help
          mkdir -p packaging-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("packaging-smoke/traceroute.json")
          report_path.write_text(
              json.dumps({"host": "example.com", "hops": [[1, "192.168.1.1", 1.23]]}),
              encoding="utf-8",
          )
          PY
          hir report-export packaging-smoke/traceroute.json --output-dir packaging-smoke/html
          test -f packaging-smoke/html/traceroute_01.html
