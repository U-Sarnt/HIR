name: quality

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install project and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run mypy
        run: python -m mypy
      - name: Run pytest with coverage
        run: |
          python -m pytest \
            --cov=hir \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-report=html \
            -q
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py312-ubuntu
          path: |
            coverage.xml
            htmlcov/

  test-matrix:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: pyproject.toml
          python-version: "3.12"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Build artifacts
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment and run smoke checks
        run: |
          rm -rf "$RUNNER_TEMP/hir-wheel-smoke"
          python -m venv "$RUNNER_TEMP/hir-wheel-smoke"
          . "$RUNNER_TEMP/hir-wheel-smoke/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          hir --help
          hir ping --help
          hir traceroute --help
          hir arp-scan --help
          hir report-export --help
          mkdir -p packaging-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("packaging-smoke/traceroute.json")
          report_path.write_text(
              json.dumps({"host": "example.com", "hops": [[1, "192.168.1.1", 1.23]]}),
              encoding="utf-8",
          )
          PY
          hir report-export packaging-smoke/traceroute.json --output-dir packaging-smoke/html
          test -f packaging-smoke/html/traceroute_01.html
