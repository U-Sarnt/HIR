[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hir"
version = "0.1.0"
description = "Early-stage Python CLI for conservative network diagnostics and report export."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yussef Jurado", email = "u.sarnt@proton.me" },
]
keywords = ["arp", "cli", "network diagnostics", "ping", "traceroute"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "click",
    "Jinja2",
    "scapy",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]
build = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/U-Sarnt/HIR"
Repository = "https://github.com/U-Sarnt/HIR"
Issues = "https://github.com/U-Sarnt/HIR/issues"
Documentation = "https://github.com/U-Sarnt/HIR/tree/master/docs"

[project.scripts]
hir = "hir.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["hir*"]
exclude = ["tests*", "results*"]

[tool.setuptools.package-data]
"hir.output" = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["hir"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["hir"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src/hir"]
mypy_path = ["src"]
no_implicit_optional = true
python_version = "3.10"
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["nmap", "scapy.*"]
follow_imports = "skip"
ignore_missing_imports = true
